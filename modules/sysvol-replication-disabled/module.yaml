id: sysvol-replication-disabled
version: 1.0.0
name: SYSVOL stops replicating
summary: One DC's SYSVOL replication is switched off in AD; Group Policy changes stop reaching it
category: Replication
difficulty: 3
destructive: false
authors:
  - Wesley Reynolds
tags: [sysvol, dfsr, group-policy]

requires:
  cert: ">=0.1"
  lab: ">=1.5"
  roles:
    DC: 2
  assessor: true

targets:
  - name: victim
    select: non-pdc-dc
  - name: source
    select: pdc

engagement:
  access: domain-admin
  briefing: briefing.md

# DFSR notices the change at its next AD poll (forced by the break), then
# leaves the SYSVOL folder; its state is no longer Normal.
settle_seconds: 180
expected_failures:
  - SYSVOL-002

break: break.ps1
verify: verify.ps1
solution: solution.md
